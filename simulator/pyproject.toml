[project]
name = "dynamic-network-simulator"
version = "0.1.0"
description = "动态通信网络仿真器（SimPy）——状态推进与事件执行；计算委托 algorithms"
requires-python = ">=3.12"
dependencies = [
    "simpy>=4.0",
    "pydantic>=2.0",
    "dynamic-network-algorithms",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulator"]

[tool.uv.sources]
dynamic-network-algorithms = { workspace = true }
