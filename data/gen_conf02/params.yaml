# 配置集gen_conf02——参赛方参数（生成逻辑默认参数见 ../../gen_scripts/gen_internal.yaml）
# 与gen_conf01的差异：小规模快速演练档（5场景）、每簇6地面节点、业务速率区间整体上调一档、事件密度加密档。

version: "sce20261031-conf02"      # 套件标识（固定：本配置集为基线套件）

scenario_count: 5                  # 场景（实例）个数
scripts_per_scenario: 10           # 每场景场景脚本（测试脚本）个数，场景内从易到难

area_km: 120.0                     # 场景区域边长（公里，正方形）
cluster_gnd: 6                     # 每节点簇的地面节点数

test_duration_min: 30              # 单次测试时长（分钟）
event_window_min: [3, 4]           # 事件窗口：T0+3分钟~Tend−4分钟（两元＝T0后分钟数、Tend前分钟数）
intra_gap_sec: [10, 60]            # 事件簇内相邻事件间隔（秒）
inter_gap_min: [3, 5]              # 相邻事件簇间隔（分钟）

# 规模表：sce01为初始规模（7平台+10地面+3空中＝20节点、链路30、背景业务30），
# sce02~sce05线性递进，sce05达120节点/150链路/130背景业务。
scenario_table:
  - {id: sce01, name: 初始规模-业务可达基线, uav: 7,  gnd: 10, air: 3, links: 30,  bg: 30,  test: 10}
  - {id: sce02, name: 小规模-链路扰动入门,   uav: 24, gnd: 18, air: 3, links: 60,  bg: 55,  test: 20}
  - {id: sce03, name: 中小规模-节点毁伤引入, uav: 43, gnd: 24, air: 3, links: 90,  bg: 80,  test: 30}
  - {id: sce04, name: 中规模-多链路并发,     uav: 61, gnd: 30, air: 4, links: 120, bg: 105, test: 40}
  - {id: sce05, name: 中大规模-组合故障,     uav: 79, gnd: 36, air: 5, links: 150, bg: 130, test: 50}

# 本配置集对生成逻辑默认参数的覆盖（微调随配置集走，不改gen_internal.yaml）
overrides:
  topology:
    cluster: {radius: 19000.0}     # 每簇6节点，簇内分布半径放大（仍满足2×radius＜视距）
  services:
    services:                      # 业务速率区间整体上调一档；上限类结构参数联动见strategyoverrides
      data: {speed_bps: [128000, 4000000]}
      image: {speed_bps: [1000000, 8000000]}
      voice: {speed_bps: [16000, 128000]}
      video: {speed_bps: [2000000, 12000000]}
  strategy:
    clusters: {base: 6, span: 4}         # 事件簇数6~10（加密档）
    events_per_cluster: {base: 2, span: 3}   # 每簇事件数2~5（加密档）
    severity: {base: 0.2, span: 0.4}     # 劣化强度温和档0.2~0.6
    feasibility: {structural_min_bw: 2000000}   # ＝上调后业务速率下限最大值（video下限2Mbps）
