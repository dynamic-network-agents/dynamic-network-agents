# 配置集gen_conf04——参赛方参数（生成逻辑默认参数见 ../../gen_scripts/gen_internal.yaml）
# 本文件只收录与运维智能体开发直接相关的参数；未列出的生成细节均有固化默认值。
# 20261104 交互式收集：中小规模快速测试集。
version: "sce20261104-conf04"      # 套件标识（固定：保持既有套件名，重生成不漂移）

scenario_count: 5                  # 场景（实例）个数，规模从易到难递进
scripts_per_scenario: 6            # 每场景场景脚本（测试脚本）个数，脚本内事件密度与难度递进

area_km: 100.0                     # 场景区域边长（公里，正方形）；留白与移动位移按区域尺度联动缩放
cluster_gnd: 4                     # 每节点簇的地面节点数（节点簇＝一片地理聚集、簇内视距互联的地面节点组，平台挂靠簇布设）

test_duration_min: 30              # 单次测试时长（分钟）
event_window_min: [2, 3]           # 事件窗口：T0+2分钟~Tend−3分钟（两元＝T0后分钟数、Tend前分钟数）
intra_gap_sec: [10, 60]            # 事件簇内相邻事件间隔（秒）
inter_gap_min: [3, 5]              # 相邻事件簇间隔（分钟）

# 规模区间：区间内按场景线性递增取值（区间模式自动编号 sce01~ 并按规模档-主题命名）。
scale_ranges:
  uav:   [20, 100]                 # 无人平台数
  gnd:   [30, 60]                  # 地面节点数
  air:   [3, 5]                    # 空中节点数
  links: [100, 300]                # 总链路数
  bg:    [100, 200]                # 背景业务数
  test:  [10, 20]                  # 测试业务数
