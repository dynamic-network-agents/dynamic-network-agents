# 配置集gen_conf01——参赛方参数（生成逻辑默认参数见 ../../gen_scripts/gen_internal.yaml）
# 本文件只收录与运维智能体开发直接相关的参数；未列出的生成细节均有固化默认值。

version: "sce20261031-conf01"      # 套件标识（固定：本配置集为基线套件；新建配置集可省略此行，套件名＝生成当日＋配置集后缀）

scenario_count: 10                 # 场景（实例）个数
scripts_per_scenario: 10           # 每场景场景脚本（测试脚本）个数，场景内从易到难

area_km: 120.0                     # 场景区域边长（公里，正方形）
cluster_gnd: 5                     # 每节点簇的地面节点数（节点簇＝一片地理聚集、簇内视距互联的地面节点组，平台挂靠簇布设）

test_duration_min: 30              # 单次测试时长（分钟）；事件窗口两端偏移之和须小于它
event_window_min: [3, 4]           # 事件窗口：T0+3分钟~Tend−4分钟（两元＝T0后分钟数、Tend前分钟数；T0测试开始、Tend测试结束）
intra_gap_sec: [10, 60]            # 事件簇内相邻事件间隔（秒）
inter_gap_min: [3, 5]              # 相邻事件簇间隔（分钟）

# 规模表（id/名称/无人平台/地面节点/空中节点/总链路/背景业务/测试业务）；
# 规模区间为 无人平台20~300、地面节点30~100、空中节点3~10、总链路100~500、背景业务100~450、测试业务10~50；
# 本基线套件按此区间逐场景线性递进取整（区域120km内结构可行）。
