[project]
name = "dynamic-network-agent-platform"
version = "0.1.0"
description = "LLM 多智能体平台（Ollama/Qwen）——智能体运行时与协同编排"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_platform"]
