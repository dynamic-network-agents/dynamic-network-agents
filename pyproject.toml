[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dynamic-network-agents"
version = "0.1.0"
description = "B03 资源受限环境下通信网络资源管控 —— 多智能体管控系统"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.0",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/common",
    "src/common/simulator",
    "src/common/perception",
    "src/common/modeling",
    "src/common/algorithms",
    "src/common/algorithms/topology",
    "src/common/algorithms/path",
    "src/common/algorithms/flow",
    "src/common/control",
    "src/common/observability",
    "src/common/config",
    "src/common/util",
    "src/baseline",
    "src/agents",
    "src/agents/ops",
    "src/agents/resource",
    "src/agents/a2a",
    "src/agents/llm",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src"]
addopts = "-q"
