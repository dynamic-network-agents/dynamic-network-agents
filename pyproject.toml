[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dynamic-network-agents"
version = "0.1.0"
description = "B03 资源受限环境下通信网络资源管控 —— 多智能体管控系统"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.0",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/api",
    "src/math_modeling",
    "src/algorithms",
    "src/agents",
    "src/util",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src"]
addopts = "-q"
