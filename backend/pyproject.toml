[project]
name = "dynamic-network-backend"
version = "0.1.0"
description = "主业务后端 / API 集成层（FastAPI）——Agent 生命周期、A2A、任务调度、RAG、策略校验"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
